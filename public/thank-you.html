<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — Riad Marrakech</title>
  <link rel="icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Manrope:wght@300;400;500;600;700&family=Amiri:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #faf6ee;
      --parchment: #f4ecdd;
      --sand: #eadfc8;
      --sand-deep: #d5c29c;
      --clay: #b08d64;
      --sage: #8ba07e;
      --sage-deep: #4c6353;
      --moss: #31443a;
      --terracotta: #c16a45;
      --terracotta-deep: #9e4f2d;
      --dusk: #dca48e;
      --dusk-soft: #eed3c3;
      --indigo-deep: #27334f;
      --ink: #2c2620;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Manrope', sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.85;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .font-display { font-family: 'Fraunces', serif; }
    .font-arabic { font-family: 'Amiri', serif; }
    main { flex: 1; display: flex; align-items: center; justify-content center; padding: 4rem 1.5rem; }
    .container { max-width: 42rem; width: 100%; text-align: center; }
    .logo { height: 5rem; width: auto; filter: brightness(0) invert(1); margin-bottom: 2rem; }
    h1 { font-family: 'Fraunces', serif; font-weight: 300; font-size: clamp(2.5rem, 5vw, 3.5rem); line-height: 1.1; color: var(--ink); margin: 0 0 1.5rem; }
    h1 em { font-style: italic; color: var(--terracotta-deep); }
    .lead { font-size: 1.125rem; color: var(--ink); opacity: 0.75; margin-bottom: 2.5rem; max-width: 32rem; margin-left: auto; margin-right: auto; }
    .reference { font-family: 'Fraunces', serif; font-size: 1.125rem; color: var(--terracotta-deep); background: var(--parchment); padding: 1rem 2rem; border-radius: 9999px; display: inline-block; margin-bottom: 2.5rem; letter-spacing: 0.05em; }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.875rem 2rem; border-radius: 9999px; background: var(--terracotta); color: var(--cream); text-decoration: none; transition: background 0.2s, transform 0.2s; }
    .btn:hover { background: var(--terracotta-deep); transform: translateY(-2px); }
    .arabic { font-family: 'Amiri', serif; font-size: 1.5rem; color: var(--dusk); opacity: 0.8; margin-top: 3rem; }
    footer { padding: 2rem 1.5rem; border-top: 1px solid var(--sand); text-align: center; font-size: 0.875rem; color: var(--ink); opacity: 0.5; }
    @media (max-width: 480px) {
      .logo { height: 4rem; }
    }
  </style>
</head>
<body>
  <main>
    <div class="container">
      <img src="/images/logo_riad.png" alt="Riad Marrakech" class="logo" />
      <h1>Thank you.<br><em>We'll be in touch soon.</em></h1>
      <p class="lead">Your inquiry for a private riad celebration in Marrakech has been received. Our team will contact you shortly to discuss the details.</p>
      <div class="reference">Your reference: <span id="ref">RM-XXXXXX</span></div>
      <a href="/" class="btn">Return to Riad Marrakech</a>
      <p class="arabic">شكراً لكم</p>
    </div>
  </main>
  <footer>
    © <span id="year"></span> Riad Marrakech · Private riads, events & experiences
  </footer>
  <script>
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref');
    if (ref) document.getElementById('ref').textContent = ref;
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
